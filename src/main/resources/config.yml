# 道の最大の長さ（マス）
max-length: 200

# mob が出現する列（横位置）。true = 道の真ん中 / false = ランダム
spawn-lane-center: false

# mob をプレイヤーから何マス離れた場所に出すか
spawn-distance: 10

# 「巨大ねこ」「巨大ウーパールーパー」の大きさ倍率
giant-scale: 3.0

# 接触判定の余裕（ブロック）。大きいほど遠くからでも接触扱い
contact-range: 0.25

# 押されるときの移動速度（1tickあたりのマス数。0.18 なら 1秒で約3.6マス）。
# mob の押す時間（秒）× この速度 × 20 が、押される総距離になる（遅くするほど、同じ秒数での距離は短くなる）
push-speed: 0.18

# ゴールの台にとどまれば勝ちになる秒数
summit-hold-seconds: 15

# 押された後、次に押されるまでの無敵時間（tick）
push-cooldown-ticks: 30

# プラグイン無効化(サーバー停止)時にコースを元に戻すか
restore-on-disable: true

# ---------------------------------------------------------------
# mob の設定（ゲーム内コマンドでは数しか指定できないので、ここで変更する）
#   seconds : 押す時間（秒）。押される距離 = 秒数 × 20 × push-speed
#   power   : 押す力。敵と味方は合計の力が大きい方が勝つ
#             （同じ種類の mob どうしは足し算されず、違う種類は足し算される）
#   speed   : 移動速度（マス/秒）
#   hit     : 必中（true = 横にずれていても、プレイヤーの位置を通過すれば必ず接触）
# mob ごとに書かなかった項目は mob-defaults が使われる。
# 書いてある mob だけが /koth enemy・/koth ally で使える（空の設定は {} と書く）。
# ---------------------------------------------------------------
mob-defaults:
  seconds: 2.0
  power: 5
  speed: 4.0
  hit: true

# /koth enemy <mob> [数] で使える mob
enemy-mobs:
  zombie: {}
  husk: {}
  skeleton: {}
  stray: {}
  spider: {}
  iron_golem:
    seconds: 3.0
    power: 12
  pig: {}
  cow: {}
  sheep: {}
  chicken: {}
  wolf: {}
  villager: {}
  cat: {}
  horse:
    power: 8
  warden:
    seconds: 5.0
    power: 50
  ender_dragon:
    seconds: 8.0
    power: 100
  wither:
    seconds: 5.0
    power: 40
  blaze: {}
  creeper: {}
  enderman: {}
  ravager:
    seconds: 3.0
    power: 15
  phantom: {}
  giant_cat:
    seconds: 3.0
    power: 20
  giant_axolotl:
    seconds: 3.0
    power: 20
  allay: {}
  sniffer:
    seconds: 3.0
    power: 15

# /koth ally <mob> [数] で使える mob
ally-mobs:
  zombie: {}
  husk: {}
  skeleton: {}
  stray: {}
  spider: {}
  iron_golem:
    seconds: 3.0
    power: 12
  pig: {}
  cow:
    power: 6
  sheep: {}
  chicken: {}
  wolf: {}
  cat: {}
  horse:
    power: 8
  villager: {}
  giant_cat:
    seconds: 3.0
    power: 20
  giant_axolotl:
    seconds: 3.0
    power: 20
  allay: {}
  sniffer:
    seconds: 3.0
    power: 15
  warden:
    seconds: 5.0
    power: 50
  ender_dragon:
    seconds: 8.0
    power: 100
  wither:
    seconds: 5.0
    power: 40
  blaze: {}
  creeper: {}
  enderman: {}
  ravager:
    seconds: 3.0
    power: 15
  phantom: {}

# /koth buff <enemy|ally> による強化。強化中は道の縦半分の床が変わる
#   味方の強化 → 道の左半分（進行方向に向かって左）が氷ブロックに
#   敵の強化   → 道の右半分が ソウルサンドに
# 強化中は、その側の mob の押す力・押す時間・速度が倍率の分だけ上がる
buff:
  duration-seconds: 30
  enemy:
    block: SOUL_SAND
    power-multiplier: 2.0
    seconds-multiplier: 1.5
    speed-multiplier: 1.5
  ally:
    block: ICE
    power-multiplier: 2.0
    seconds-multiplier: 1.5
    speed-multiplier: 1.5

# ウォーデン・エンダードラゴン・ウィザーの乱入演出（遠くから現れ、カメラが追う）
intro:
  enabled: true
  distance: 30      # 出現する距離（マス）
  max-ticks: 200    # 演出の最大の長さ（tick、20tick=1秒）。ボスが近づくと自動で終わる

# 勝ち数・負け数・押し合いの力のスコアボード（画面右に、自分の「勝ち」「負け」と、
# 押す力（味方）・押し戻す力（敵）・その合計だけを表示。名前は載せない。
# コースの上にいる間だけ、そのプレイヤー専用のスコアボードに切り替わる）
#   勝ち = ゴールの台に規定の秒数とどまって勝利したとき
#   負け = ダメージゲージが 0 になった（-1win）とき
# 記録は koth_wins / koth_losses という名前のスコアボードにも保存され、再起動しても残る。
# 例: /scoreboard players get Steve koth_wins
scoreboard:
  enabled: true              # 画面右のスコアボードを表示するか（false でも記録は残る）
  title: "KOTH 戦績"
  minus-win-on-loss: false   # true にすると、負けたとき勝ち数も 1 減る（0 未満にはならない）

# ゴールまでの距離の表示（画面上部のボスバー「ゴールまで N マス」）
goal-distance:
  enabled: true

# スタート地点の壁に敵に押し付けられたときのダメージゲージ（数値で表示。0 になると「-1win」）
wall-damage:
  enabled: true
  gauge-max: 100          # ゲージの最大値
  per-block: 10           # 壁に押し付けられた1マス分ごとに減る量
  regen-per-second: 0     # 1秒ごとの自然回復量（0 = 回復しない）
  kill-on-zero: false     # true にするとゲージが 0 になったときプレイヤーが死亡する
  reset-delay-ticks: 60   # 0 になって「-1win」と表示してから、満タンに戻るまでの時間（tick、20tick=1秒）

# 道のブロック（/koth material <種類> <素材> でも変更できる）
materials:
  floor: STONE_BRICKS         # 道の床
  fill: STONE_BRICKS          # 道の下の埋め草
  pad: SMOOTH_STONE           # スタート台
  goal: GOLD_BLOCK            # ゴールの台
  wall: STONE_BRICKS          # スタート地点の壁（敵に押し付けられる壁）
